name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  HUSKY: '0'

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trades
          POSTGRES_PASSWORD: trades
          POSTGRES_DB: trades
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trades -d trades"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://trades:trades@localhost:5432/trades
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run database migrations
        run: pnpm --filter backend exec prisma migrate deploy

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
